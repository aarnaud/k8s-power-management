[package]
name = "power-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "DaemonSet agent that watches Node labels and applies CPU power profiles via cpu-power-hal"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
cpu-power-hal = { path = "../cpu-power-hal" }
futures = "0.3.34"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
kube = { version = "4.2.0", features = ["runtime", "client", "rustls-tls"] }
prometheus = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
